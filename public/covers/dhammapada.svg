<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBuddha" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1206"/>
      <stop offset="50%" stop-color="#33240E"/>
      <stop offset="100%" stop-color="#100A02"/>
    </linearGradient>
    <linearGradient id="goldBuddha" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <filter id="glowBuddha" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" rx="16" fill="url(#bgBuddha)"/>

  <!-- Ornate Border -->
  <rect x="24" y="24" width="552" height="752" rx="12" fill="none" stroke="url(#goldBuddha)" stroke-width="3" opacity="0.85"/>
  <rect x="36" y="36" width="528" height="728" rx="8" fill="none" stroke="url(#goldBuddha)" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>

  <!-- Top Category -->
  <text x="300" y="105" font-family="'Cinzel', 'Noto Serif', serif" font-size="14" font-weight="bold" fill="#FEF3C7" letter-spacing="6" text-anchor="middle" opacity="0.9">BUDDHISM • BUDDHA VANI • PALI CANON</text>

  <!-- Central Dharma Wheel (☸️ Dharmachakra) -->
  <circle cx="300" cy="235" r="95" fill="#241708" stroke="url(#goldBuddha)" stroke-width="2" filter="url(#glowBuddha)"/>
  <circle cx="300" cy="235" r="75" fill="none" stroke="url(#goldBuddha)" stroke-width="1.5" opacity="0.5"/>

  <!-- 8-Spoked Dharma Wheel -->
  <g transform="translate(300, 235)" stroke="url(#goldBuddha)" fill="none" filter="url(#glowBuddha)">
    <circle cx="0" cy="0" r="48" stroke-width="5"/>
    <circle cx="0" cy="0" r="14" fill="url(#goldBuddha)"/>
    <!-- 8 Spokes -->
    <line x1="0" y1="-48" x2="0" y2="48" stroke-width="3"/>
    <line x1="-48" y1="0" x2="48" y2="0" stroke-width="3"/>
    <line x1="-34" y1="-34" x2="34" y2="34" stroke-width="3"/>
    <line x1="34" y1="-34" x2="-34" y2="34" stroke-width="3"/>
  </g>

  <!-- Grand Titles -->
  <text x="300" y="420" font-family="'Noto Serif Devanagari', serif" font-size="46" font-weight="bold" fill="url(#goldBuddha)" text-anchor="middle" filter="url(#glowBuddha)">धम्मपद (बुद्ध वाणी)</text>

  <text x="300" y="475" font-family="'Cinzel', 'Cinzel Decorative', serif" font-size="28" font-weight="bold" fill="#FFFBEB" letter-spacing="3" text-anchor="middle">THE DHAMMAPADA</text>

  <line x1="160" y1="510" x2="440" y2="510" stroke="url(#goldBuddha)" stroke-width="2" opacity="0.7"/>
  <polygon points="300,505 306,510 300,515 294,510" fill="url(#goldBuddha)"/>

  <!-- Subtitle and Attributes -->
  <text x="300" y="555" font-family="'Noto Sans', sans-serif" font-size="16" font-weight="bold" fill="#FDE68A" text-anchor="middle">26 Vaggas • 423 Verses • Pali &amp; Hindi • Audio Synced 🎧</text>
  
  <text x="300" y="590" font-family="'Noto Serif', serif" font-size="14" font-style="italic" fill="#D4D4D8" text-anchor="middle">Gautama Buddha • Path of Righteousness &amp; Mindfulness</text>

  <!-- Bottom Badge -->
  <g transform="translate(300, 680)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1A1206" stroke="url(#goldBuddha)" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#FEF3C7" letter-spacing="2" text-anchor="middle">PALI TEXT SOCIETY CANON</text>
  </g>
</svg>
