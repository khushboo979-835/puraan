<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgJain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211306"/>
      <stop offset="50%" stop-color="#3D260D"/>
      <stop offset="100%" stop-color="#140B03"/>
    </linearGradient>
    <linearGradient id="goldJain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="glowJain" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" rx="16" fill="url(#bgJain)"/>

  <!-- Ornate Border -->
  <rect x="24" y="24" width="552" height="752" rx="12" fill="none" stroke="url(#goldJain)" stroke-width="3" opacity="0.85"/>
  <rect x="36" y="36" width="528" height="728" rx="8" fill="none" stroke="url(#goldJain)" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>

  <!-- Top Category -->
  <text x="300" y="105" font-family="'Cinzel', 'Noto Serif', serif" font-size="14" font-weight="bold" fill="#FEF3C7" letter-spacing="6" text-anchor="middle" opacity="0.9">JAINISM • AHIMSA PARAMO DHARMA</text>

  <!-- Central Ahimsa Hand Emblem -->
  <circle cx="300" cy="235" r="95" fill="#2B1B0A" stroke="url(#goldJain)" stroke-width="2" filter="url(#glowJain)"/>

  <!-- Jain Ahimsa Palm with 24-spoke wheel -->
  <g transform="translate(300, 235)" filter="url(#glowJain)">
    <!-- Palm outline -->
    <path d="M -22 35 C -30 20 -32 -5 -30 -25 C -30 -35 -20 -35 -20 -20 L -18 -5 L -18 -42 C -18 -52 -8 -52 -8 -40 L -6 -5 L -6 -48 C -6 -58 4 -58 4 -46 L 6 -5 L 6 -38 C 6 -48 16 -48 16 -36 L 16 10 C 26 5 32 15 28 28 C 24 38 10 45 -4 46 Z" fill="url(#goldJain)"/>
    <!-- Wheel of Dharma in Palm -->
    <circle cx="-3" cy="12" r="14" fill="#2B1B0A" stroke="url(#goldJain)" stroke-width="2"/>
    <circle cx="-3" cy="12" r="4" fill="url(#goldJain)"/>
  </g>

  <!-- Grand Titles -->
  <text x="300" y="415" font-family="'Noto Serif Devanagari', serif" font-size="36" font-weight="bold" fill="url(#goldJain)" text-anchor="middle" filter="url(#glowJain)">तत्त्वार्थ सूत्र एवं कल्प सूत्र</text>

  <text x="300" y="470" font-family="'Cinzel', 'Cinzel Decorative', serif" font-size="24" font-weight="bold" fill="#FFFBEB" letter-spacing="2" text-anchor="middle">TATTVARTHA SUTRA &amp; KALPA SUTRA</text>

  <line x1="160" y1="505" x2="440" y2="505" stroke="url(#goldJain)" stroke-width="2" opacity="0.7"/>
  <polygon points="300,500 306,505 300,510 294,505" fill="url(#goldJain)"/>

  <!-- Subtitle and Attributes -->
  <text x="300" y="550" font-family="'Noto Sans', sans-serif" font-size="16" font-weight="bold" fill="#FDE68A" text-anchor="middle">10 Adhyays • 357 Sutras • Prakrit &amp; Sanskrit • Audio Synced 🎧</text>
  
  <text x="300" y="585" font-family="'Noto Serif', serif" font-size="14" font-style="italic" fill="#D4D4D8" text-anchor="middle">Acharya Umaswati &amp; Bhadrabahu • Moksha Marga</text>

  <!-- Bottom Badge -->
  <g transform="translate(300, 680)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#211306" stroke="url(#goldJain)" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#FEF3C7" letter-spacing="2" text-anchor="middle">AUTHENTIC JAIN AGAMA STANDARD</text>
  </g>
</svg>
