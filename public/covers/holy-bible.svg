<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBible" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F080C"/>
      <stop offset="50%" stop-color="#3B1019"/>
      <stop offset="100%" stop-color="#120306"/>
    </linearGradient>
    <linearGradient id="goldBible" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="glowBible" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" rx="16" fill="url(#bgBible)"/>

  <!-- Ornate Border -->
  <rect x="24" y="24" width="552" height="752" rx="12" fill="none" stroke="url(#goldBible)" stroke-width="3" opacity="0.85"/>
  <rect x="36" y="36" width="528" height="728" rx="8" fill="none" stroke="url(#goldBible)" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>

  <!-- Corner Cross Motifs -->
  <path d="M 50 38 L 50 62 M 38 46 L 62 46" stroke="url(#goldBible)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 550 38 L 550 62 M 538 46 L 562 46" stroke="url(#goldBible)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 50 738 L 50 762 M 38 746 L 62 746" stroke="url(#goldBible)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 550 738 L 550 762 M 538 746 L 562 746" stroke="url(#goldBible)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Top Category -->
  <text x="300" y="105" font-family="'Cinzel', 'Noto Serif', serif" font-size="14" font-weight="bold" fill="#FEF3C7" letter-spacing="6" text-anchor="middle" opacity="0.9">CHRISTIANITY • THE HOLY SCRIPTURES</text>

  <!-- Central Radiant Cross Emblem -->
  <circle cx="300" cy="235" r="95" fill="#290B12" stroke="url(#goldBible)" stroke-width="2" filter="url(#glowBible)"/>
  <circle cx="300" cy="235" r="75" fill="none" stroke="url(#goldBible)" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Embossed Latin Cross -->
  <g transform="translate(300, 235)" filter="url(#glowBible)">
    <!-- Vertical Beam -->
    <path d="M -9 -55 L 9 -55 L 9 55 L -9 55 Z" fill="url(#goldBible)"/>
    <!-- Horizontal Crossbeam -->
    <path d="M -38 -25 L 38 -25 L 38 -7 L -38 -7 Z" fill="url(#goldBible)"/>
  </g>

  <!-- Grand Titles -->
  <text x="300" y="420" font-family="'Cinzel', 'Cinzel Decorative', serif" font-size="44" font-weight="bold" fill="url(#goldBible)" text-anchor="middle" filter="url(#glowBible)">THE HOLY BIBLE</text>

  <text x="300" y="475" font-family="'Noto Serif Devanagari', serif" font-size="28" font-weight="bold" fill="#FFFBEB" letter-spacing="2" text-anchor="middle">पवित्र बाइबिल (PSALMS &amp; GOSPELS)</text>

  <line x1="160" y1="510" x2="440" y2="510" stroke="url(#goldBible)" stroke-width="2" opacity="0.7"/>
  <polygon points="300,505 306,510 300,515 294,510" fill="url(#goldBible)"/>

  <!-- Subtitle and Attributes -->
  <text x="300" y="555" font-family="'Noto Sans', sans-serif" font-size="16" font-weight="bold" fill="#FDE68A" text-anchor="middle">Old &amp; New Testament • Psalms &amp; John • Audio Synced 🎧</text>
  
  <text x="300" y="590" font-family="'Noto Serif', serif" font-size="14" font-style="italic" fill="#D4D4D8" text-anchor="middle">King David &amp; Apostles • King James &amp; Hindi Edition</text>

  <!-- Bottom Badge -->
  <g transform="translate(300, 680)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1F080C" stroke="url(#goldBible)" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#FEF3C7" letter-spacing="2" text-anchor="middle">AUTHORISED LITURGICAL TEXT</text>
  </g>
</svg>
