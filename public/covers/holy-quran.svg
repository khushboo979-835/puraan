<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgQuran" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041F16"/>
      <stop offset="50%" stop-color="#0A382A"/>
      <stop offset="100%" stop-color="#02120C"/>
    </linearGradient>
    <linearGradient id="goldQuran" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="glowQuran" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" rx="16" fill="url(#bgQuran)"/>

  <!-- Islamic Geometric Ornate Border -->
  <rect x="24" y="24" width="552" height="752" rx="12" fill="none" stroke="url(#goldQuran)" stroke-width="3" opacity="0.85"/>
  <rect x="36" y="36" width="528" height="728" rx="8" fill="none" stroke="url(#goldQuran)" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>

  <!-- Islamic Arabesque Corner Medallions -->
  <circle cx="50" cy="50" r="16" fill="#0A382A" stroke="url(#goldQuran)" stroke-width="2"/>
  <circle cx="550" cy="50" r="16" fill="#0A382A" stroke="url(#goldQuran)" stroke-width="2"/>
  <circle cx="50" cy="750" r="16" fill="#0A382A" stroke="url(#goldQuran)" stroke-width="2"/>
  <circle cx="550" cy="750" r="16" fill="#0A382A" stroke="url(#goldQuran)" stroke-width="2"/>

  <!-- Top Category -->
  <text x="300" y="105" font-family="'Cinzel', 'Noto Serif', serif" font-size="14" font-weight="bold" fill="#FEF3C7" letter-spacing="6" text-anchor="middle" opacity="0.9">ISLAM • THE NOBLE DIVINE REVELATION</text>

  <!-- Central Islamic Mandala Arch & Arabic Calligraphy -->
  <circle cx="300" cy="240" r="105" fill="#05261C" stroke="url(#goldQuran)" stroke-width="2.5" filter="url(#glowQuran)"/>
  <circle cx="300" cy="240" r="85" fill="none" stroke="url(#goldQuran)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>

  <!-- Arabic Calligraphy: القرآن الكريم -->
  <text x="300" y="260" font-family="'Amiri', 'Scheherazade New', 'Traditional Arabic', serif" font-size="52" font-weight="bold" fill="url(#goldQuran)" text-anchor="middle" filter="url(#glowQuran)">القرآن الكريم</text>

  <!-- Grand Titles -->
  <text x="300" y="420" font-family="'Amiri', 'Noto Naskh Arabic', serif" font-size="46" font-weight="bold" fill="url(#goldQuran)" text-anchor="middle" filter="url(#glowQuran)">अल-क़ुरआन अल-करीम</text>

  <text x="300" y="475" font-family="'Cinzel', 'Cinzel Decorative', serif" font-size="28" font-weight="bold" fill="#FFFBEB" letter-spacing="3" text-anchor="middle">THE HOLY QURAN</text>

  <line x1="160" y1="510" x2="440" y2="510" stroke="url(#goldQuran)" stroke-width="2" opacity="0.7"/>
  <polygon points="300,505 306,510 300,515 294,510" fill="url(#goldQuran)"/>

  <!-- Subtitle and Attributes -->
  <text x="300" y="555" font-family="'Noto Sans', sans-serif" font-size="16" font-weight="bold" fill="#FDE68A" text-anchor="middle">114 Surahs • Arabic, Hindi &amp; English • Audio Synced 🎧</text>
  
  <text x="300" y="590" font-family="'Noto Serif', serif" font-size="14" font-style="italic" fill="#D4D4D8" text-anchor="middle">Divine Revelation • Surah Al-Fatiha &amp; Ayat Al-Kursi</text>

  <!-- Bottom Badge -->
  <g transform="translate(300, 680)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#041F16" stroke="url(#goldQuran)" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#FEF3C7" letter-spacing="2" text-anchor="middle">AUTHENTIC TAFSIR &amp; TAJWEED</text>
  </g>
</svg>
