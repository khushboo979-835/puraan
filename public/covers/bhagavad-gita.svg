<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGita" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F0D03"/>
      <stop offset="50%" stop-color="#381907"/>
      <stop offset="100%" stop-color="#120601"/>
    </linearGradient>
    <linearGradient id="goldGita" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D1"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glowGita" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" rx="16" fill="url(#bgGita)"/>

  <!-- Ornate Outer Gold Border -->
  <rect x="24" y="24" width="552" height="752" rx="12" fill="none" stroke="url(#goldGita)" stroke-width="3" opacity="0.85"/>
  <rect x="36" y="36" width="528" height="728" rx="8" fill="none" stroke="url(#goldGita)" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>

  <!-- Corner Indian Mandir Motifs -->
  <path d="M 24 60 C 40 60 60 40 60 24 L 24 24 Z" fill="url(#goldGita)" opacity="0.8"/>
  <path d="M 576 60 C 560 60 540 40 540 24 L 576 24 Z" fill="url(#goldGita)" opacity="0.8"/>
  <path d="M 24 740 C 40 740 60 760 60 776 L 24 776 Z" fill="url(#goldGita)" opacity="0.8"/>
  <path d="M 576 740 C 560 740 540 760 540 776 L 576 776 Z" fill="url(#goldGita)" opacity="0.8"/>

  <!-- Sun Rays & Om Emblem -->
  <circle cx="300" cy="220" r="90" fill="none" stroke="url(#goldGita)" stroke-width="2" opacity="0.4"/>
  <circle cx="300" cy="220" r="110" fill="none" stroke="url(#goldGita)" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>
  <circle cx="300" cy="220" r="75" fill="#240F04" stroke="url(#goldGita)" stroke-width="2" filter="url(#glowGita)"/>

  <!-- Sacred OM Symbol -->
  <text x="300" y="248" font-family="'Tiro Devanagari Sanskrit', 'Noto Serif Devanagari', 'Siddhanta', serif" font-size="76" font-weight="bold" fill="url(#goldGita)" text-anchor="middle" filter="url(#glowGita)">ॐ</text>

  <!-- Top Scripture Category -->
  <text x="300" y="105" font-family="'Cinzel', 'Noto Serif', serif" font-size="14" font-weight="bold" fill="#FEF3C7" letter-spacing="6" text-anchor="middle" opacity="0.9">SANATAN DHARMA • VEDIC SACRED SHASTRA</text>

  <!-- Main Grand Title in Sanskrit & English -->
  <text x="300" y="420" font-family="'Noto Serif Devanagari', 'Yatra One', serif" font-size="44" font-weight="bold" fill="url(#goldGita)" text-anchor="middle" filter="url(#glowGita)">श्रीमद्भगवद्गीता</text>
  
  <text x="300" y="475" font-family="'Cinzel', 'Cinzel Decorative', serif" font-size="28" font-weight="bold" fill="#FFFBEB" letter-spacing="3" text-anchor="middle">SHRIMAD BHAGAVAD GITA</text>

  <line x1="160" y1="510" x2="440" y2="510" stroke="url(#goldGita)" stroke-width="2" opacity="0.7"/>
  <polygon points="300,505 306,510 300,515 294,510" fill="url(#goldGita)"/>

  <!-- Subtitle and Attributes -->
  <text x="300" y="555" font-family="'Noto Sans', sans-serif" font-size="16" font-weight="bold" fill="#FDE68A" text-anchor="middle">18 Adhyays • 700 Shlokas • Audio Synced 🎧</text>
  
  <text x="300" y="590" font-family="'Noto Serif', serif" font-size="14" font-style="italic" fill="#D4D4D8" text-anchor="middle">Maharshi Ved Vyasa • Bhagavan Sri Krishna Samvaad</text>

  <!-- Bottom Crest & Authentication -->
  <g transform="translate(300, 680)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#180A02" stroke="url(#goldGita)" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#FEF3C7" letter-spacing="2" text-anchor="middle">CRITICAL MANUSCRIPT EDITION</text>
  </g>
</svg>
