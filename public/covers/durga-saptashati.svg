<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDurga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B030E"/>
      <stop offset="45%" stop-color="#600718"/>
      <stop offset="80%" stop-color="#2D0209"/>
      <stop offset="100%" stop-color="#140104"/>
    </linearGradient>
    <linearGradient id="goldDurga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="30%" stop-color="#FBBF24"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="crimsonFlame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <filter id="glowDurga" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" rx="16" fill="url(#bgDurga)"/>

  <!-- Ornate Outer Gold Border -->
  <rect x="24" y="24" width="552" height="752" rx="12" fill="none" stroke="url(#goldDurga)" stroke-width="3" opacity="0.9"/>
  <rect x="36" y="36" width="528" height="728" rx="8" fill="none" stroke="url(#goldDurga)" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.65"/>

  <!-- Corner Mandir Motifs -->
  <path d="M 24 60 C 40 60 60 40 60 24 L 24 24 Z" fill="url(#goldDurga)" opacity="0.85"/>
  <path d="M 576 60 C 560 60 540 40 540 24 L 576 24 Z" fill="url(#goldDurga)" opacity="0.85"/>
  <path d="M 24 740 C 40 740 60 760 60 776 L 24 776 Z" fill="url(#goldDurga)" opacity="0.85"/>
  <path d="M 576 740 C 560 740 540 760 540 776 L 576 776 Z" fill="url(#goldDurga)" opacity="0.85"/>

  <!-- Top Category Banner -->
  <text x="300" y="105" font-family="'Cinzel', 'Noto Serif', serif" font-size="13" font-weight="bold" fill="#FEF3C7" letter-spacing="5" text-anchor="middle" opacity="0.95">MARKANDEYA PURANA • SHAKTI UPASANA</text>

  <!-- Sun Rays & Aura Rings -->
  <circle cx="300" cy="225" r="95" fill="none" stroke="url(#goldDurga)" stroke-width="2" opacity="0.35"/>
  <circle cx="300" cy="225" r="115" fill="none" stroke="url(#goldDurga)" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>
  <circle cx="300" cy="225" r="78" fill="#290208" stroke="url(#goldDurga)" stroke-width="2" filter="url(#glowDurga)"/>

  <!-- Central Sacred Trishul (Trident) & Lotus Emblem of Maa Durga -->
  <g transform="translate(300, 225)" filter="url(#glowDurga)">
    <!-- Trishul Central Shaft -->
    <line x1="0" y1="-50" x2="0" y2="45" stroke="url(#goldDurga)" stroke-width="4" stroke-linecap="round"/>
    <!-- Central Blade Point -->
    <path d="M 0 -62 L -7 -45 L 7 -45 Z" fill="url(#goldDurga)"/>
    <!-- Left Crescent Prongs -->
    <path d="M 0 5 C -25 5 -36 -20 -32 -48 C -30 -30 -18 -15 0 -8" fill="none" stroke="url(#goldDurga)" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="-32,-50 -26,-38 -37,-39" fill="url(#goldDurga)"/>
    <!-- Right Crescent Prongs -->
    <path d="M 0 5 C 25 5 36 -20 32 -48 C 30 -30 18 -15 0 -8" fill="none" stroke="url(#goldDurga)" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="32,-50 37,-39 26,-38" fill="url(#goldDurga)"/>
    <!-- Damru and Base Ring -->
    <circle cx="0" cy="10" r="6" fill="url(#goldDurga)"/>
    <path d="M -12 28 C 0 24 0 24 12 28 L 8 40 C 0 36 0 36 -8 40 Z" fill="url(#goldDurga)" opacity="0.9"/>
  </g>

  <!-- Sacred Mantra Inscription -->
  <text x="300" y="360" font-family="'Noto Serif Devanagari', 'Yatra One', serif" font-size="15" font-weight="bold" fill="#FDE68A" letter-spacing="3" text-anchor="middle" opacity="0.9">॥ ॐ ऐं ह्रीं क्लीं चामुण्डायै विच्चे ॥</text>

  <!-- Main Grand Title in Sanskrit & English -->
  <text x="300" y="425" font-family="'Noto Serif Devanagari', 'Yatra One', serif" font-size="44" font-weight="bold" fill="url(#goldDurga)" text-anchor="middle" filter="url(#glowDurga)">श्री दुर्गा सप्तशती</text>
  
  <text x="300" y="475" font-family="'Cinzel', 'Cinzel Decorative', serif" font-size="26" font-weight="bold" fill="#FFFBEB" letter-spacing="3" text-anchor="middle">SHRI DURGA SAPTASHATI</text>

  <text x="300" y="505" font-family="'Noto Serif Devanagari', serif" font-size="16" font-weight="600" fill="#FCA5A5" letter-spacing="2" text-anchor="middle">( सम्पूर्ण चंडी पाठ • गीता प्रेस गोरखपुर संस्करण )</text>

  <line x1="150" y1="525" x2="450" y2="525" stroke="url(#goldDurga)" stroke-width="2" opacity="0.75"/>
  <polygon points="300,520 306,525 300,530 294,525" fill="url(#goldDurga)"/>

  <!-- Subtitle and Attributes -->
  <text x="300" y="565" font-family="'Noto Sans', sans-serif" font-size="16" font-weight="bold" fill="#FDE68A" text-anchor="middle">13 Adhyayas • 700 Shlokas • Sanskrit, Hindi &amp; English</text>
  
  <text x="300" y="600" font-family="'Noto Serif', serif" font-size="14" font-style="italic" fill="#E2E8F0" text-anchor="middle">Maharshi Markandeya • Mahakali, Mahalakshmi &amp; Mahasaraswati Charitra</text>

  <text x="300" y="630" font-family="'Noto Sans', sans-serif" font-size="13" font-weight="bold" fill="#FCA5A5" text-anchor="middle">⚡ AI Synchronized Audio Recitation &amp; Word-by-Word Meaning</text>

  <!-- Bottom Crest & Navratri Special Badge -->
  <g transform="translate(300, 700)">
    <rect x="-180" y="-20" width="360" height="40" rx="20" fill="#200206" stroke="url(#goldDurga)" stroke-width="2"/>
    <text x="0" y="6" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="#FEF3C7" letter-spacing="2" text-anchor="middle">🌺 NAVRATRI SPECIAL • 100% FREE ACCESS</text>
  </g>
</svg>
