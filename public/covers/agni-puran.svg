<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAgni" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#260C03"/>
      <stop offset="50%" stop-color="#471A08"/>
      <stop offset="100%" stop-color="#140601"/>
    </linearGradient>
    <linearGradient id="goldAgni" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <filter id="glowAgni" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" rx="16" fill="url(#bgAgni)"/>

  <!-- Ornate Border -->
  <rect x="24" y="24" width="552" height="752" rx="12" fill="none" stroke="url(#goldAgni)" stroke-width="3" opacity="0.85"/>
  <rect x="36" y="36" width="528" height="728" rx="8" fill="none" stroke="url(#goldAgni)" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>

  <!-- Top Category -->
  <text x="300" y="105" font-family="'Cinzel', 'Noto Serif', serif" font-size="14" font-weight="bold" fill="#FEF3C7" letter-spacing="6" text-anchor="middle" opacity="0.9">VEDIC MAHAPURANA • SACRED YAJNA JYOTI</text>

  <!-- Central Sacred Vedic Fire (Agni Flame) Emblem -->
  <circle cx="300" cy="235" r="95" fill="#301004" stroke="url(#goldAgni)" stroke-width="2" filter="url(#glowAgni)"/>

  <!-- Sacred Agni Flame Shape -->
  <g transform="translate(300, 235)" filter="url(#glowAgni)">
    <!-- Yajna Kund Base -->
    <path d="M -45 35 L 45 35 L 35 50 L -35 50 Z" fill="url(#goldAgni)"/>
    <!-- Outer Flame -->
    <path d="M 0 -60 C 25 -30 45 -10 35 25 C 25 40 -25 40 -35 25 C -45 -10 -25 -30 0 -60 Z" fill="url(#goldAgni)"/>
    <!-- Inner Core Flame -->
    <path d="M 0 -40 C 15 -20 25 -5 18 18 C 12 28 -12 28 -18 18 C -25 -5 -15 -20 0 -40 Z" fill="#FFFBEB"/>
  </g>

  <!-- Grand Titles -->
  <text x="300" y="420" font-family="'Noto Serif Devanagari', serif" font-size="48" font-weight="bold" fill="url(#goldAgni)" text-anchor="middle" filter="url(#glowAgni)">अग्नि पुराण</text>

  <text x="300" y="475" font-family="'Cinzel', 'Cinzel Decorative', serif" font-size="28" font-weight="bold" fill="#FFFBEB" letter-spacing="3" text-anchor="middle">AGNI PURAN</text>

  <line x1="160" y1="510" x2="440" y2="510" stroke="url(#goldAgni)" stroke-width="2" opacity="0.7"/>
  <polygon points="300,505 306,510 300,515 294,510" fill="url(#goldAgni)"/>

  <!-- Subtitle and Attributes -->
  <text x="300" y="555" font-family="'Noto Sans', sans-serif" font-size="16" font-weight="bold" fill="#FDE68A" text-anchor="middle">383 Adhyays • 15,400 Shlokas • Sanskrit &amp; Hindi • Audio Synced 🎧</text>
  
  <text x="300" y="590" font-family="'Noto Serif', serif" font-size="14" font-style="italic" fill="#D4D4D8" text-anchor="middle">Maharshi Ved Vyasa • Agni Dev &amp; Sage Vashistha Samvaad</text>

  <!-- Bottom Badge -->
  <g transform="translate(300, 680)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#260C03" stroke="url(#goldAgni)" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#FEF3C7" letter-spacing="2" text-anchor="middle">BORI CRITICAL MANUSCRIPT</text>
  </g>
</svg>
